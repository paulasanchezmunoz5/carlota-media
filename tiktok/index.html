<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Conexión con TikTok</title>
<style>body{font-family:-apple-system,system-ui,sans-serif;max-width:560px;margin:60px auto;padding:16px;text-align:center}
code{display:block;background:#f2f2f2;padding:16px;border-radius:8px;word-break:break-all;font-size:15px;margin:16px 0}
button{padding:10px 20px;border-radius:8px;border:0;background:#111;color:#fff;font-size:16px}</style></head>
<body><h2>Conexión con TikTok</h2><p id="m">Copia este código y pégalo en VS Code:</p><code id="c">—</code>
<button onclick="navigator.clipboard.writeText(document.getElementById('c').textContent)">Copiar</button>
<script>const p=new URLSearchParams(location.search);const c=p.get('code');
if(c){document.getElementById('c').textContent=c}else{document.getElementById('m').textContent='No ha llegado ningún código: '+(p.get('error_description')||p.get('error')||'vuelve a intentarlo.')}</script>
</body></html>
